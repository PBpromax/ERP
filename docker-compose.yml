# Local dependencies only; backend/frontend run separately.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: internal_oms
      POSTGRES_USER: ${OMS_DB_USERNAME:-oms}
      POSTGRES_PASSWORD: ${OMS_DB_PASSWORD:?Set OMS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    profiles: [extras]
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    profiles: [extras]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-omsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - oms_minio:/data

volumes:
  oms_postgres:
  oms_minio:
