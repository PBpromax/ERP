log_format oms_timing '$remote_addr $request_method $uri status=$status '
                      'request_time=$request_time upstream_time=$upstream_response_time';

upstream oms_backend {
  server 127.0.0.1:8081;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  root /opt/oms/frontend;
  index index.html;
  client_max_body_size 50m;
  access_log /var/log/nginx/oms_access.log oms_timing;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types application/json application/javascript image/svg+xml text/css text/javascript text/plain;

  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://oms_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
}
